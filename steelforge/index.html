<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script>
    /* Resolve ./assets and fetched page fragments against the app directory (index.html), including /steelforge/ on Vercel. */
    (function () {
      if (location.protocol === 'file:' || location.protocol === 'blob:') return;
      var path = location.pathname || '/';
      var dir;
      if (path === '/' || path === '') dir = '/';
      else if (path.endsWith('/')) dir = path;
      else {
        var i = path.lastIndexOf('/');
        var last = i >= 0 ? path.slice(i + 1) : '';
        if (last.indexOf('.') !== -1) dir = path.slice(0, i + 1) || '/';
        else dir = path + '/';
      }
      var b = document.createElement('base');
      b.href = dir;
      document.head.insertBefore(b, document.head.children[1] || null);
    })();
  </script>
  <title>Steel Analysis &amp; Design Calculator | Bicol University</title>
  <meta name="description" content="Steel Analysis &amp; Design Calculator — structural steel tension, compression, bending, and shear checks aligned with ASTM-related coursework materials." />

  <!-- Fonts: vintage + technical (clean & readable) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Special+Elite&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link id="sfStyles" rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/compression-design-layout.css" />
  <link rel="stylesheet" href="./css/compression-analysis-dashboard.css" />
  <link rel="stylesheet" href="./css/sf-hub-tension-bending.css" />
  <link rel="stylesheet" href="./css/shear-analysis-dashboard.css" />
  <link rel="stylesheet" href="./css/overview-landing.css" />
  <link rel="stylesheet" href="./css/tension-analysis-layout.css" />
  <link rel="stylesheet" href="./css/tension-design-layout.css" />
  <link rel="stylesheet" href="./css/tension-rod-modern.css" />

  <script>
    /* Always reload local CSS + JS (dev-friendly). Inject every script with ?v=<build> so
       browsers never serve stale section-props.js, tension-analysis.js, etc. */
    (function () {
      var v = Date.now();
      var scripts = [
        './js/sf-static-assets.js',
        './js/steel-db.js',
        './js/workbook-materials.js',
        './js/shear-csv-shapes.js',
        './js/steel-grade.js',
        './js/section-props.js',
        './js/calculator.js',
        './js/tension-analysis.js',
        './js/tension-rod-analysis.js',
        './js/bending-analysis.js',
        './js/bending-design.js',
        './js/main.js',
      ];
      scripts.forEach(function (src) {
        var s = document.createElement('script');
        // async=false on dynamically-inserted scripts preserves DOM-insertion order,
        // matching the original <script defer> behavior.
        s.async = false;
        s.defer = true;
        s.src = src + '?v=' + v;
        document.head.appendChild(s);
      });
      document.querySelectorAll('link[rel="stylesheet"]').forEach(function (lnk) {
        var href = lnk.getAttribute('href') || '';
        if (href.indexOf('./css/') !== 0) return;
        if (href.indexOf('?') !== -1) return;
        lnk.href = href + '?v=' + v;
      });
    })();
  </script>
</head>
<body>
  <div class="notebook-full">
    <!-- HEADER (university + app) -->
    <header class="steelforge-header" role="banner">
      <div class="sf-hero sf-hero-uni">
        <div class="sf-uni">
          <div class="sf-uni-logos" aria-hidden="true">
            <span class="sf-uni-badge">
              <img class="sf-uni-logo sf-uni-logo--bu" src="./assets/bu-logo-transparent.png" alt="" />
            </span>
            <span class="sf-uni-badge">
              <img class="sf-uni-logo sf-uni-logo--buceng" src="./assets/buceng-logo-transparent2.png" alt="" />
            </span>
          </div>
          <div class="sf-uni-text">
            <div class="sf-uni-wordmark" aria-label="Bicol University">
              <span class="sf-uni-bicol">BICOL</span>
              <span class="sf-uni-university">UNIVERSITY</span>
            </div>
            <div class="sf-uni-sub">Civil Engineering Department</div>
            <div class="sf-app-name">Steel Analysis &amp; Design Calculator</div>
          </div>
        </div>
      </div>
    </header>

    <!-- BUTTONS: One line only — modules aligned horizontally -->
    <div class="buttons-single-line">
      <div class="buttons-scroll" id="buttonsScrollWrapper">
        <button class="page-btn" data-page="overview"><i class="fas fa-chart-pie"></i> OVERVIEW</button>
        <button class="page-btn" data-page="steel-grade"><i class="fas fa-microchip"></i> STEEL GRADE</button>
        <button class="page-btn" data-page="section-props"><i class="fas fa-cube"></i> SECTION PROPS</button>
        <button class="page-btn" data-page="tension"><i class="fas fa-arrow-right"></i> TENSION</button>
        <button class="page-btn" data-page="compression"><i class="fas fa-arrow-left"></i> COMPRESSION</button>
        <button class="page-btn" data-page="tension-rod"><i class="fas fa-ruler-combined"></i> TENSION ROD</button>
        <button class="page-btn" data-page="bending"><i class="fas fa-chart-line"></i> BENDING</button>
        <button class="page-btn" data-page="shear"><i class="fas fa-cut"></i> SHEAR</button>
      </div>
    </div>

    <!-- Dynamic content panel -->
    <div class="content-panel" id="dynamicPanel">
      <!-- initial content: overview loaded via js -->
    </div>
  </div>
</body>
</html>
